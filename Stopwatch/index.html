<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Stopwatch</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(0, 123, 255, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255, 165, 0, 0.18), transparent 32%),
                var(--background-light);
        }

        .stopwatch-container {
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(18px);
        }

        .dark-mode .stopwatch-container {
            background: rgba(34, 34, 34, 0.88);
            border-color: rgba(255, 255, 255, 0.08);
        }

        header h1 {
            margin: 0;
            font-size: 1.7rem;
        }

        .app-kicker {
            margin: 4px 0 0;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        #theme-toggle {
            border: none;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            background: #eef2ff;
            color: #1f2937;
            font-weight: 600;
        }

        .time-panel {
            padding: 24px 16px;
            margin: 18px 0;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.12), rgba(255, 165, 0, 0.12));
        }

        .timer-label {
            margin: 0 0 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            opacity: 0.65;
        }

        .focus-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.8rem;
            opacity: 0.75;
        }

        .buttons button {
            min-width: 82px;
            font-weight: 700;
        }
</style>
</head>
<body>
    <div class="stopwatch-container">
        <header>
            <h1>Stopwatch</h1>
            <button id="theme-toggle">Toggle Theme</button>
        </header>
        <main>
            <div id="display">00:00:00</div>
            <div class="buttons">
                <button id="start">Start</button>
                <button id="pause">Pause</button>
                <button id="reset">Reset</button>
                <button id="lap">Lap</button>
            </div>
            <div class="laps">
                <h2>Lap Times</h2>
                <ul id="laps-list"></ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
